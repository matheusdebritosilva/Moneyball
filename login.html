<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Entrar — 2K Stats</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">
    <main class="login-card">
        <p class="login-brand">🏆 2K STATS <small>HALL OF FAME</small></p>
        <h1>Bem-vindo de volta</h1>
        <p>Entre para administrar a plataforma esportiva.</p>
        <form id="login-form"><label>E-mail<input type="email" name="email" required autocomplete="email"
                    value="admin@2kstats.gg"></label><label>Senha<input type="password" name="password" required
                    autocomplete="current-password" value="admin123"></label><button class="btn gold">Entrar</button>
            <p id="login-error" role="alert"></p>
        </form><small>Primeiro acesso: admin@2kstats.gg · senha: admin123</small>
    </main>
    <script>document.getElementById('login-form').onsubmit = async e => { e.preventDefault(); const d = Object.fromEntries(new FormData(e.target)), r = await fetch('api.php?action=login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(d) }), j = await r.json(); if (!r.ok) { document.getElementById('login-error').textContent = j.error || 'Não foi possível entrar.'; return } location.href = 'index.html' }</script>
</body>

</html>
